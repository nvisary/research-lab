[project]
name = "researchlab"
version = "0.1.0"
description = "Crypto strategy auto-research — adaptation of karpathy/autoresearch"
requires-python = ">=3.11,<3.14"
dependencies = [
    "ccxt>=4.3",
    "pandas>=2.1",
    "pyarrow>=15",
    "numpy>=1.26,<3",
    "scipy>=1.11",
    "tqdm>=4.66",
    "vectorbt>=0.26",
    "fastapi>=0.115",
    "uvicorn>=0.32",
]

[tool.uv]
package = false
