[project]
name = "researchlab"
version = "0.1.0"
description = "Crypto strategy auto-research — adaptation of karpathy/autoresearch"
requires-python = ">=3.11,<3.14"
dependencies = [
    "ccxt>=4.3",
    "pandas>=2.1",
    "pyarrow>=15",
    "numpy>=1.26,<3",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "tqdm>=4.66",
    "vectorbt>=0.26",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "statsmodels>=0.14",
    "scikit-learn>=1.4",
    "textual>=8.2.8",
    "pyqtgraph>=0.14.0",
    "pyside6>=6.11.1",
    "qasync>=0.28.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyterlab>=4.6.0",
    "nbconvert>=7.17.1",
    "pytest>=9.0.3",
]
